<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; position: relative; z-index: 8; background: #F7F5F2; color: #111010; font-family: 'Archivo', system-ui, sans-serif;">
<div style="background: #111010; color: #F7F5F2; padding: 10px clamp(20px, 5.5vw, 80px); display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;">
<span>Ouvert aux opportunités · CDI · Arras &amp; Hauts-de-France</span>
<a href="APropos.dc.html" style="color: #FF5A1F; text-decoration: none;">Voir mon parcours →</a>
</div>
<header style="border-bottom: 1px solid #E3DFD9; position: relative;">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 5.5vw, 80px); height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
<a href="Main.dc.html" style="font-weight: 850; font-variation-settings: 'wdth' 112; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; color: #111010; white-space: nowrap;">NOM PRÉNOM<span style="color: #FF5A1F;">.</span></a>
<nav aria-label="Navigation principale" style="display: flex; align-items: center; gap: 32px; font-size: 15px; font-weight: 500;">
<sc-if value="{{wide}}" hint-placeholder-val="{{true}}">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">{{l.label}}</a>
</sc-for>
</sc-if>
<a href="Selection.dc.html" aria-label="Ma sélection, {{count}} éléments" style="{{selStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
<sc-if value="{{wide}}" hint-placeholder-val="{{true}}"><span>Ma sélection</span></sc-if>
<span style="{{countStyle}}">{{count}}</span>
</a>
<sc-if value="{{narrow}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{expanded}}" aria-label="{{menuLabel}}" style="width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid #111010; color: #111010; cursor: pointer; margin-left: -16px;">
<sc-if value="{{closed}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></sc-if>
</button>
</sc-if>
</nav>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 100%; background: #F7F5F2; border-bottom: 2px solid #111010; padding: 8px clamp(20px, 5.5vw, 80px) 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px;">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.menuStyle}}"><span>{{l.label}}</span><span aria-hidden="true">→</span></a>
</sc-for>
</nav>
</sc-if>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","catalogue","apropos","contact","selection","aucun"],"default":"catalogue"},"count":{"editor":"int","default":3,"min":0,"max":13},"$preview":{"width":1440,"height":124}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, narrow: typeof window !== 'undefined' && window.innerWidth < 1024 };
  }
  componentDidMount() {
    this._onResize = () => this.setState({ narrow: window.innerWidth < 1024 });
    window.addEventListener('resize', this._onResize);
    this._onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const active = this.props.active ?? 'catalogue';
    const count = Number(this.props.count ?? 3);
    const open = this.state.open;
    const defs = [
      { key: 'accueil', label: 'Accueil', href: 'Main.dc.html' },
      { key: 'catalogue', label: 'Catalogue', href: 'Catalogue.dc.html' },
      { key: 'apropos', label: 'À propos', href: 'APropos.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' }
    ];
    const links = defs.map((d) => ({
      label: d.label, href: d.href,
      current: d.key === active ? 'page' : 'false',
      style: 'color: #111010; ' + (d.key === active ? 'text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px;' : 'text-decoration: none;'),
      menuStyle: 'display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #E3DFD9; text-decoration: none; font-size: 24px; font-weight: 800; font-variation-settings: \'wdth\' 108; color: ' + (d.key === active ? '#C2410C;' : '#111010;')
    }));
    const selOn = active === 'selection';
    return {
      links, count, open, closed: !open,
      narrow: this.state.narrow, wide: !this.state.narrow,
      expanded: open ? 'true' : 'false',
      menuLabel: open ? 'Fermer le menu' : 'Ouvrir le menu',
      toggleMenu: () => this.setState({ open: !open }),
      selStyle: 'display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border: 1px solid #111010; text-decoration: none; ' + (selOn ? 'background: #111010; color: #F7F5F2;' : 'color: #111010;'),
      countStyle: 'display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; font-family: IBM Plex Mono, monospace; font-size: 12px; font-weight: 600; ' + (count > 0 ? 'background: #FF5A1F; color: #111010;' : 'background: #E3DFD9; color: #2B2927;')
    };
  }
}
</script>
</body>
</html>
